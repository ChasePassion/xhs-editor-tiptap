name: Deploy

# 推送到 main 即自动构建并部署到服务器；也可在 Actions 页面手动触发
on:
  push:
    branches: [main]
  workflow_dispatch:

# 同一分支多次推送串行部署，避免并发写覆盖
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Deploy to server (rsync)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # 服务器 22 端口对外开放，常遭 SSH 爆破，sshd 在负载下会间歇性丢弃连接。
          # 因此 ssh 自带连接重试(ConnectionAttempts)，外层再对 rsync 多次重试。
          SSH_CMD="ssh -p $SSH_PORT -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new -o ConnectionAttempts=5 -o ConnectTimeout=20 -o ServerAliveInterval=5"
          for i in 1 2 3 4 5; do
            if rsync -az --delete --stats -e "$SSH_CMD" dist/ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"; then
              echo "✓ 部署成功 (第 $i 次尝试)"
              exit 0
            fi
            echo "⚠ rsync 第 $i 次失败，5s 后重试..." >&2
            sleep 5
          done
          echo "✗ rsync 多次重试仍失败" >&2
          exit 1
